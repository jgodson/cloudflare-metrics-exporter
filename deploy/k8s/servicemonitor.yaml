apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-metrics-exporter
  labels:
    app: cloudflare-metrics-exporter
spec:
  selector:
    matchLabels:
      app: cloudflare-metrics-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 10s
