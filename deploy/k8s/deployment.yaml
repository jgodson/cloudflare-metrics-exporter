apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-metrics-exporter
  labels:
    app: cloudflare-metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflare-metrics-exporter
  template:
    metadata:
      labels:
        app: cloudflare-metrics-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/jasongodson/cloudflare-metrics-exporter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-metrics-exporter
                  key: CF_API_TOKEN
            - name: CF_ZONE_TAGS
              value: "<zone-tag-1,zone-tag-2>"
            - name: CF_ACCOUNT_TAG
              value: "<account-tag-or-empty>"
            - name: CF_HOSTS
              value: "example.com,docs.example.com,templates.example.com"
            - name: ENABLED_QUERIES
              value: "http,firewall,gateway_l7"
            - name: POLL_INTERVAL
              value: "60s"
            - name: WINDOW
              value: "1m"
            - name: PORT
              value: "8080"
            - name: REQUEST_TIMEOUT
              value: "10s"
            - name: LOG_LEVEL
              value: "info"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
